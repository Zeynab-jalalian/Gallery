<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <title>Image Gallery + Search Box</title>
</head>

<body>


    <div class="container">
        <div class="search-box">
            <i class="bx bx-search"></i>
            <input type="text" placeholder="Search a Painter">
        </div>

        <div class="images">
            <div class="image-box" data-name="van gogh">
                <img src="img/van1.jpg" alt="">
                <h6> van gogh</h6>
            </div>
            <div class="image-box" data-name="picasso">
                <img src="img/pic1.jpg" alt="">
                <h6> picasso</h6>
            </div>
            <div class="image-box" data-name="Leonardo da Vinci">
                <img src="img/d1.jpg" alt="">
                <h6> Leonardo da Vinci</h6>
            </div>
            <div class="image-box" data-name="van gogh">
                <img src="img/van2.jpg" alt="">
                <h6> van gogh</h6>
            </div>
            <div class="image-box" data-name="picasso">
                <img src="img/pic2.jpg" alt="">
                <h6> picasso</h6>
            </div>
            <div class="image-box" data-name="Leonardo da Vinci">
                <img src="img/d2.jpg" alt="">
                <h6> Leonardo da Vinci</h6>
            </div>
            <div class="image-box" data-name="van gogh">
                <img src="img/van3.jpg" alt="">
                <h6> van gogh</h6>
            </div>
            <div class="image-box" data-name="picasso">
                <img src="img/pic3.jpg" alt="">
                <h6> picasso</h6>
            </div>
            <div class="image-box" data-name="Leonardo da Vinci">
                <img src="img/d3.jpg" alt="">
                <h6> Leonardo da Vinci</h6>
            </div>
        </div>
    </div>



    <script src="script.js"></script>
</body>

</html>
